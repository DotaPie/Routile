<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Routile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="shell">
  <aside id="panel">
    <header>
      <h1>Routile</h1>
    </header>

    <div class="tiles">
      <div class="tile">
        <span class="tile-label">Area</span>
        <span id="area-info" class="tile-value muted">—</span>
      </div>
      <div class="tile">
        <span class="tile-label">Start</span>
        <span id="pin-info" class="tile-value muted">area centre</span>
      </div>
    </div>

    <section class="block">
      <div class="field">
        <span>Direction</span>
        <div class="segmented" role="radiogroup" aria-label="Direction">
          <label>
            <input type="radio" name="direction" id="dir-oneway" value="oneway" checked>
            <span>One way</span>
          </label>
          <label>
            <input type="radio" name="direction" id="dir-both" value="both">
            <span>Both ways</span>
          </label>
        </div>
      </div>

      <label class="field">
        <span>Passes per street</span>
        <input type="number" id="passes" value="1" min="1" step="1" inputmode="numeric">
      </label>

      <label class="switch">
        <input type="checkbox" id="session-enabled">
        <span class="track" aria-hidden="true"></span>
        <span class="switch-label">Split into sessions</span>
      </label>

      <label class="field hidden" id="session-field">
        <span>Session length (hours)</span>
        <input type="text" id="session" value="2" inputmode="decimal"
               placeholder="2" autocomplete="off">
      </label>
    </section>

    <section id="estimate-card" class="block hidden">
      <h2>Estimate</h2>
      <div class="tiles">
        <div class="tile accent">
          <span class="tile-label">Distance</span>
          <span class="tile-value" id="est-km">—</span>
        </div>
        <div class="tile accent">
          <span class="tile-label">Driving time</span>
          <span class="tile-value" id="est-time">—</span>
        </div>
      </div>
      <div class="tiles" id="est-extra">
        <div class="tile accent">
          <span class="tile-label">Roads to cover</span>
          <span class="tile-value" id="est-roads">—</span>
        </div>
        <div class="tile accent">
          <span class="tile-label">Sessions</span>
          <span class="tile-value" id="est-sessions">—</span>
        </div>
      </div>
      <div id="est-warn" class="warn hidden"></div>
    </section>

    <button id="compute" class="primary" disabled>Compute route</button>

    <div id="progress" class="progress hidden">
      <div class="bar"><div class="fill"></div></div>
      <div class="progress-text"></div>
    </div>
    <div id="error" class="error hidden"></div>

    <section id="stats-card" class="block hidden">
      <div class="tiles four" id="summary"></div>
      <button id="download" class="primary" type="button">Download</button>
      <p class="hint" id="download-note"></p>
    </section>

  </aside>

  <main id="map">
    <div id="toolbar" class="toolbar" role="group" aria-label="Map tools">
      <button id="mode-pan" class="tool" title="Pan the map">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0 0V4.5a1.5 1.5 0 0 1 3 0V11m0 0V6.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6v-1.5a1.5 1.5 0 0 1 3 0V13"/></svg>
        <span>Pan</span>
      </button>

      <span class="tool-sep" aria-hidden="true"></span>

      <button id="mode-rect" class="tool active" title="Drag to draw a rectangle"
              aria-label="Draw a rectangle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1.5" stroke-dasharray="3 2.5"/></svg>
        <span>Rectangle</span>
      </button>
      <button id="mode-circle" class="tool" title="Drag out from the centre to draw a circle"
              aria-label="Draw a circle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5" stroke-dasharray="3 2.5"/></svg>
        <span>Circle</span>
      </button>
      <button id="mode-freehand" class="tool" title="Drag to draw any shape by hand, back to the ring to close it"
              aria-label="Draw freehand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.4c4.3 0 7.8 2.4 7.8 5.4s-3.5 5.4-7.8 5.4-7.8-2.4-7.8-5.4S7.7 4.4 12 4.4z"/><path d="M9.2 15c-.7 1.6-.5 3.4.9 4.6"/></svg>
        <span>Freehand</span>
      </button>

      <span class="tool-sep" aria-hidden="true"></span>

      <button id="mode-pin" class="tool" title="Click the map to set where the route starts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s6.5-6.2 6.5-11a6.5 6.5 0 1 0-13 0C5.5 14.8 12 21 12 21z"/><circle cx="12" cy="10" r="2.4"/></svg>
        <span>Start</span>
        <svg id="pin-check" class="check hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>
      </button>
    </div>

    <div id="legend" class="legend hidden" role="list" aria-label="Sessions"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
