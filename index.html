<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Routile</title>
  <meta name="description" content="Draw an area on a map and get a route that drives every road inside it.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Crect%20width='24'%20height='24'%20rx='6'%20fill='%2335d29a'/%3E%3Cpath%20d='M5.5%2020V3H12a4.5%204.5%200%200%201%200%209H9.5L17%2020'%20fill='none'%20stroke='%230b1a15'%20stroke-width='2.4'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3Ccircle%20cx='17'%20cy='20'%20r='3.2'%20fill='%230b1a15'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- Cloudflare Web Analytics -->
  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "504d8d79becc42ea89d4c7234289901d"}'></script>
  <!-- End Cloudflare Web Analytics -->
</head>
<body>
<div id="shell">
  <aside id="panel">
    <header>
      <span class="brand">
        <!-- The mark is the R: one route line - stem, bowl, leg - ending at
             its destination. The rest of the name is set in type after it. -->
        <h1><svg class="logo" viewBox="3 0 18.5 24" role="img" aria-label="R">
          <path d="M5.5 20V3H12a4.5 4.5 0 0 1 0 9H9.5L17 20"/>
          <circle class="logo-dot" cx="17" cy="20" r="3"/>
        </svg>outile</h1>
      </span>
    </header>

    <!-- Reads back a zip this page produced: the metadata.json inside it holds
         the settings, the drawn zones and the computed route together. -->
    <div id="dropzone" class="dropzone" role="button" tabindex="0"
         aria-label="Load a saved Routile zip">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 15.5V4m0 0L8.2 7.8M12 4l3.8 3.8"/>
        <path d="M4 14.5v3A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5v-3"/>
      </svg>
      <span class="dropzone-title">Load a saved route</span>
      <span class="dropzone-hint">Drop a Routile .zip here, or click to choose</span>
    </div>
    <input id="load-file" class="hidden" type="file" accept=".zip,application/zip">

    <div class="tiles">
      <div class="tile">
        <span class="tile-label">Area</span>
        <span id="area-info" class="tile-value muted">--</span>
      </div>
      <div class="tile">
        <span class="tile-label">Start</span>
        <span id="pin-info" class="tile-value muted">area centre</span>
      </div>
    </div>

    <section class="block">
      <div class="field">
        <span>Direction</span>
        <div class="segmented" role="radiogroup" aria-label="Direction">
          <label>
            <input type="radio" name="direction" id="dir-oneway" value="oneway" checked>
            <span>One way</span>
          </label>
          <label>
            <input type="radio" name="direction" id="dir-both" value="both">
            <span>Both ways</span>
          </label>
        </div>
      </div>

      <label class="switch">
        <input type="checkbox" id="private-roads">
        <span class="track" aria-hidden="true"></span>
        <span class="switch-label">Include private roads</span>
      </label>

      <label class="field">
        <span>Passes per street</span>
        <input type="number" id="passes" value="1" min="1" step="1" inputmode="numeric">
      </label>

      <label class="switch">
        <input type="checkbox" id="session-enabled">
        <span class="track" aria-hidden="true"></span>
        <span class="switch-label">Split into sessions</span>
      </label>

      <label class="field hidden" id="session-field">
        <span>Session length (hours)</span>
        <input type="text" id="session" value="2" inputmode="decimal"
               placeholder="2" autocomplete="off">
      </label>
    </section>

    <button id="compute" class="primary" disabled>Compute route</button>

    <div id="progress" class="progress hidden">
      <div class="bar"><div class="fill"></div></div>
      <div class="progress-text"></div>
    </div>
    <div id="error" class="error hidden"></div>

    <section id="stats-card" class="block hidden">
      <div class="tiles four" id="summary"></div>
      <button id="download" class="primary" type="button">Download</button>
      <p class="hint" id="download-note"></p>
    </section>

    <a class="repo-link" href="https://github.com/DotaPie/Routile"
       target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.03 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      <span>DotaPie/Routile</span>
    </a>

  </aside>

  <main id="stage">
    <div id="map"></div>

    <div id="topbar" class="card">
      <div id="toolbar" class="toolbar" role="group" aria-label="Map tools">
        <button id="mode-pan" class="tool" aria-label="Pan the map">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0 0V4.5a1.5 1.5 0 0 1 3 0V11m0 0V6.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6v-1.5a1.5 1.5 0 0 1 3 0V13"/></svg>
          <span>Pan</span>
        </button>

        <span class="tool-sep" aria-hidden="true"></span>

        <button id="mode-rect" class="tool active" aria-label="Draw a rectangle">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1.5" stroke-dasharray="3 2.5"/></svg>
          <span>Rectangle</span>
        </button>
        <button id="mode-circle" class="tool" aria-label="Draw a circle">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5" stroke-dasharray="3 2.5"/></svg>
          <span>Circle</span>
        </button>
        <button id="mode-freehand" class="tool" aria-label="Draw freehand">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.4c4.3 0 7.8 2.4 7.8 5.4s-3.5 5.4-7.8 5.4-7.8-2.4-7.8-5.4S7.7 4.4 12 4.4z"/><path d="M9.2 15c-.7 1.6-.5 3.4.9 4.6"/></svg>
          <span>Freehand</span>
        </button>

        <span class="tool-sep" aria-hidden="true"></span>

        <button id="mode-pin" class="tool" aria-label="Set where the route starts">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s6.5-6.2 6.5-11a6.5 6.5 0 1 0-13 0C5.5 14.8 12 21 12 21z"/><circle cx="12" cy="10" r="2.4"/></svg>
          <span>Start</span>
        </button>

        <span class="tool-sep" aria-hidden="true"></span>

        <button id="clear-zones" class="tool danger" type="button" disabled
                aria-label="Clear the zones, the start and the route">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V5.6A1.6 1.6 0 0 1 11.6 4h.8A1.6 1.6 0 0 1 14 5.6V7m-7.2 0 .8 11.2A2 2 0 0 0 9.6 20h4.8a2 2 0 0 0 2-1.8L17.2 7"/></svg>
          <span>Clear</span>
        </button>
      </div>

      <span id="basemap-sep" class="tool-sep" aria-hidden="true"></span>

      <!-- Rows are filled in from BASEMAPS in config.js. Written out rather
           than left to a <select>, whose popup is drawn by the OS and cannot
           be given the panel's shape or the accent on the chosen row. -->
      <div id="basemap-field" class="basemap">
        <button id="basemap-button" class="basemap-button" type="button"
                aria-haspopup="listbox" aria-expanded="false"
                aria-label="Choose the basemap">
          <svg class="basemap-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 4.5 3.5 7v12.5L9 17l6 2.5 5.5-2.5V4.5L15 7 9 4.5zM9 4.5V17M15 7v12.5"/>
          </svg>
          <span id="basemap-label"></span>
          <svg class="basemap-chevron" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m7 10 5 5 5-5"/>
          </svg>
        </button>
        <ul id="basemap-list" class="basemap-list hidden" role="listbox"
            aria-label="Basemap"></ul>
      </div>

      <span class="tool-sep search-sep" aria-hidden="true"></span>

      <form id="search" class="search" role="search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.4 15.4 4.1 4.1"/>
        </svg>
        <input id="search-input" type="text" autocomplete="off" spellcheck="false"
               placeholder="Search a place" aria-label="Search for a place">
        <button id="search-go" class="search-go" type="submit" aria-label="Go to this place">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6.5 18.5 12 13 17.5"/></svg>
        </button>
      </form>
    </div>

    <div id="legend" class="legend hidden" role="list" aria-label="Sessions"></div>

    <!-- Loading a file is a deliberate act with a deliberate answer, so when it
         fails it says so over the map rather than in a line down the panel. -->
    <div id="map-alert" class="map-alert hidden" role="alertdialog" aria-modal="false"
         aria-labelledby="map-alert-text">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 4.5 2.8 20h18.4L12 4.5z"/>
        <path d="M12 10v4.2"/><circle cx="12" cy="17.2" r="0.9" fill="currentColor" stroke="none"/>
      </svg>
      <p id="map-alert-text"></p>
      <button id="map-alert-close" type="button">Dismiss</button>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<!-- Boolean polygon ops, so overlapping zones become one merged shape. -->
<script src="https://cdn.jsdelivr.net/npm/polygon-clipping@0.15.7/dist/polygon-clipping.umd.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
